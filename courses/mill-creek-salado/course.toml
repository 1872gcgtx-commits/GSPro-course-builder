[course]
name = "Mill Creek Golf Club (Salado, TX)"
slug = "mill-creek-salado"
tee_sets = ["Blue", "White", "Red", "Green"]   # order + colours: tee_settings/tees.json (review page)

# Property outline (traced by the course owner); trees and QA are limited to it
boundary = [[-97.523671, 30.962331], [-97.50312, 30.961898], [-97.500702, 30.959508],
            [-97.500782, 30.954342], [-97.498705, 30.952103], [-97.498512, 30.946196],
            [-97.503362, 30.946351], [-97.51589, 30.948463], [-97.527308, 30.948594],
            [-97.529855, 30.950001], [-97.528067, 30.954902]]

[terrain]
# Square terrain tile centred here, axis-aligned to the local UTM grid.
center_lat = 30.954299         # centre of the 27-hole property outline
center_lon = -97.514087
size_m = 3300              # property spans 3.0 km E-W x 1.76 km N-S
heightmap_res = 4097       # 513 | 1025 | 2049 | 4097  (4097 over 2000 m = 0.49 m spacing)
dem_res_m = 0.5            # LiDAR ground grid; greens/bunkers need <= 0.5 m
splat_res = 4096
source = "lidar_ept"       # lidar_ept   : USGS 3DEP point cloud streamed from AWS (best)
                           # lidar_files : your own .laz/.las tiles (lidar_files = ["data/laz/*.laz"])
                           # usgs_3dep   : 1 m bare-earth DEM only (no trees/water from LiDAR)
                           # file        : your own DEM GeoTIFF (dem_file = "...")
# lidar_crs = "EPSG:3735"  # only if your .laz has no CRS
# lidar_z_units = "auto"   # auto | m | ft | usft

[imagery]
source = "naip"            # USDA NAIP, public domain; "none" to skip
resolution_m = 0.5

[layout]
source = "osm"             # OpenStreetMap golf=* features; "geojson" to use only your file
file = "features.geojson"  # your hand-traced additions/overrides (QGIS or geojson.io)
shift_m = [1.0, -1.5]      # NAIP aerial -> LiDAR registration (scripts/estimate_shift.py):
                           # greens/tees traced on the photo sit 1.0 m W, 1.5 m N of their pads

[grading]                  # defaults shown; delete lines you don't change
tee_max_slope = 0.015      # tee pads levelled to <= 1.5 %
tee_raise_m = 0.0
green_smooth_m = 0.6       # removes LiDAR noise, keeps contours
green_slope_warn = 0.03
fairway_smooth_m = 0.5
bunker_mode = "auto"       # auto (keep LiDAR bowl if present) | carve | lidar
bunker_depth_m = 0.6
bunker_lip_m = 0.25        # lip on the green-facing side
water_freeboard_m = 0.3    # water surface below the lowest bank
water_depth_m = 1.8

[surfaces]
fringe_width_m = 1.0       # collar around greens
first_cut_width_m = 2.0    # intermediate rough around fairways

[foliage]
source = "auto"            # auto (LiDAR canopy, else scatter in `trees` areas) | lidar | scatter | none
boundary_margin_m = 400    # trees this far around the property (matches [homes] margin_m)
min_height_m = 3.0
keep_clear_m = 1.0

[meshes]
offset_m = 0.0             # lift course-surface meshes above terrain (e.g. 0.02) if they z-fight

[nines]                    # names as used by the club / TXGA
1 = "Creek 1"
2 = "Creek 2"
3 = "Creek 3"
# Routings default to every pair: Course 1-2, Course 1-3, Course 2-3

[homes]                    # houses around the course (Microsoft open footprints + LiDAR heights)
margin_m = 400             # build homes within this distance of the property outline

[species]                  # tree species (live oak, Ashe juniper, cedar elm, pecan, cypress, mesquite, hackberry)
shrubs = true              # understory brush / young cedar as shrubs.csv
